light:
  - platform: template
    lights:
      livingroom_active:
        friendly_name: "livingroom_active"
        level_template: >
          {% set data = namespace(numbers=[]) %}
          {% for s in state_attr('group.living_room_dim', 'entity_id') %}
            {% if is_state(s, 'on') %}
              {% set data.numbers = [state_attr(s, "brightness")] + data.numbers %}
            {% endif %}
          {% endfor %}
          {{data.numbers|average|round(0)}}
        value_template: >
          {%- set data = namespace(res="off") -%}
          {% for s in state_attr('group.living_room_dim', 'entity_id') %}
            {% if is_state(s, 'on') %}
              {%- set data.res = "on" -%}
            {% endif %}
          {%- endfor -%}
          {{data.res}}
        temperature_template: >
          {% set data = namespace(numbers=[]) %}
          {% for s in state_attr('group.living_room_dim', 'entity_id') %}
            {% if state_attr(s, "color_temp") %}
              {% set data.numbers = [state_attr(s, "color_temp")] + data.numbers %}
            {% endif %}
          {% endfor %}
          {{data.numbers|average|round(0)}}
        turn_on:
          - action: light.turn_on
            data:
              entity_id: group.living_room_dim
        turn_off:
          - action: light.turn_off
            data:
              entity_id: group.living_room_dim
        set_level:
          - action: light.turn_on
            target:
              # wat te doen als alles uit staat? If statement om alles aan te zetten
              entity_id: "{{ expand('group.living_room_dim') | selectattr('state','eq','on') | map(attribute='entity_id') | join(',') }}"
            data:
              brightness: "{{ brightness }}"
        set_temperature:
          - action: light.turn_on
            target:
              entity_id: "{{ expand('group.living_room_dim') | selectattr('state','eq','on') | map(attribute='entity_id') | join(',') }}"
            data:
              color_temp: "{{ color_temp }}"

