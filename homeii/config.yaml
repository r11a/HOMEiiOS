name: HOMEiiOS Alpha
version: "0.1.0-alpha.4"
slug: homeii
description: Premium dashboard runtime and control plane for Home Assistant OS
url: https://github.com/r11a/HOMEiiOS
stage: experimental
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:view-dashboard-variant
panel_title: HOMEiiOS
panel_admin: true
homeassistant_api: true
apparmor: false
backup: hot
map:
  - addon_config:rw
options:
  refresh_seconds: 2
  log_level: info
schema:
  refresh_seconds: int(1,30)
  log_level: list(debug|info|warning|error)
