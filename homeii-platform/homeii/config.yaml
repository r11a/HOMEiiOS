name: HOMEii Platform
version: "0.1.0"
slug: homeii
description: Control plane, installer and asset manager for the HOMEii dashboard OS
url: https://github.com/homeii/homeii-platform
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:view-dashboard-variant
panel_title: HOMEii Studio
homeassistant_api: true
auth_api: true
apparmor: true
map:
  - addon_config:rw
options:
  channel: stable
  automatic_backup: true
  backup_keep: 5
  telemetry: false
schema:
  channel: list(stable|beta|dev)
  automatic_backup: bool
  backup_keep: int(1,20)
  telemetry: bool
