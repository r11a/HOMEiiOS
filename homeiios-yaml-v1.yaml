# HOMEiiOS Glass V1
# Dashboard חדש ועצמאי. הקובץ המקורי aa.yaml אינו משתנה.
# דרישות: button-card, card-mod, bubble-card, kiosk-mode.

kiosk_mode:
  kiosk: '[[[ return states["input_boolean.kiosk_full"]?.state === "on"; ]]]'
  user_settings:
    - users:
        - tablet
      hide_header: true
      hide_sidebar: true
      hide_menubutton: true

button_card_templates:
  homeiios_glass:
    show_state: true
    styles:
      card:
        - border-radius: 20px
        - border: 1px solid rgba(255, 255, 255, 0.16)
        - background: rgba(14, 20, 31, 0.52)
        - backdrop-filter: blur(20px) saturate(135%)
        - -webkit-backdrop-filter: blur(20px) saturate(135%)
        - box-shadow: 0 14px 42px rgba(0, 0, 0, 0.20)
        - padding: 16px
        - transition: transform 220ms cubic-bezier(.2,.8,.2,1), background 220ms ease, border-color 220ms ease
      name:
        - font-family: Heebo, Arial, sans-serif
        - font-size: 15px
        - font-weight: 600
        - color: rgba(255,255,255,.96)
      state:
        - font-family: Heebo, Arial, sans-serif
        - font-size: 13px
        - font-weight: 400
        - color: rgba(255,255,255,.62)
      icon:
        - color: rgba(255,255,255,.88)
    extra_styles: |
      @media (hover: hover) {
        #card:hover {
          transform: translateY(-2px);
          background: rgba(22, 30, 45, 0.62);
          border-color: rgba(255, 255, 255, 0.26);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #card { transition: none !important; animation: none !important; }
      }

  homeiios_quick_action:
    template: homeiios_glass
    size: 25px
    aspect_ratio: 1/1
    show_state: false
    styles:
      card:
        - padding: 14px
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: 1fr min-content
      icon:
        - width: 25px
      name:
        - justify-self: start
        - align-self: end
        - font-size: 14px
    state:
      - value: 'on'
        styles:
          card:
            - background: linear-gradient(145deg, rgba(255,191,90,.27), rgba(255,255,255,.10))
            - border-color: rgba(255, 203, 120, .48)
          icon:
            - color: '#FFD08A'

  homeiios_nav_item:
    show_state: false
    size: 22px
    styles:
      card:
        - background: transparent
        - border: 0
        - box-shadow: none
        - border-radius: 15px
        - padding: 8px 10px
        - min-height: 52px
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: 24px min-content
        - row-gap: 3px
      icon:
        - width: 22px
        - color: rgba(255,255,255,.56)
      name:
        - font-family: Heebo, Arial, sans-serif
        - font-size: 11px
        - font-weight: 500
        - color: rgba(255,255,255,.58)
    extra_styles: |
      #card:active { background: rgba(255,255,255,.10); transform: scale(.96); }

  homeiios_room:
    template: homeiios_glass
    show_state: false
    aspect_ratio: 1.45/1
    styles:
      card:
        - padding: 18px
      grid:
        - grid-template-areas: '"i status" "n n" "label label"'
        - grid-template-columns: 42px 1fr
        - grid-template-rows: 42px 1fr min-content
      img_cell:
        - width: 42px
        - height: 42px
        - border-radius: 14px
        - background: rgba(255,255,255,.10)
      icon:
        - width: 23px
      name:
        - justify-self: start
        - align-self: end
        - font-size: 18px
        - font-weight: 600
      label:
        - justify-self: start
        - margin-top: 3px
        - font-family: Heebo, Arial, sans-serif
        - font-size: 12px
        - color: rgba(255,255,255,.58)
      custom_fields:
        status:
          - justify-self: end
          - align-self: start
          - font-family: Heebo, Arial, sans-serif
          - font-size: 12px
          - color: rgba(255,255,255,.64)

  homeiios_metric:
    template: homeiios_glass
    show_icon: true
    show_state: true
    styles:
      card:
        - min-height: 112px
      grid:
        - grid-template-areas: '"i n" "s s"'
        - grid-template-columns: 34px 1fr
        - grid-template-rows: 34px 1fr
      icon:
        - width: 21px
        - color: rgba(181,220,255,.90)
      name:
        - justify-self: start
        - font-size: 13px
        - color: rgba(255,255,255,.62)
      state:
        - justify-self: start
        - align-self: end
        - font-size: 24px
        - font-weight: 600
        - color: rgba(255,255,255,.96)

views:
  - title: בית
    path: home
    icon: mdi:home-rounded
    type: sections
    theme: HOMEiiOS Glass
    max_columns: 4
    dense_section_placement: true
    background:
      opacity: 100
      alignment: center
      size: cover
      repeat: no-repeat
      attachment: fixed
      image: /local/homeiios/homeiios-livingroom-warm.png
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:button-card
            entity: sensor.time_date
            show_icon: false
            show_state: false
            show_name: false
            tap_action:
              action: none
            custom_fields:
              eyebrow: >
                [[[ const h = new Date().getHours();
                    if (h < 5) return 'לילה טוב';
                    if (h < 12) return 'בוקר טוב';
                    if (h < 17) return 'צהריים טובים';
                    if (h < 21) return 'ערב טוב';
                    return 'לילה טוב'; ]]]
              title: הבית שלכם
              clock: >
                [[[ return new Intl.DateTimeFormat('he-IL', {hour:'2-digit', minute:'2-digit', hour12:false}).format(new Date()); ]]]
              date: >
                [[[ return new Intl.DateTimeFormat('he-IL', {weekday:'long', day:'numeric', month:'long'}).format(new Date()); ]]]
              weather: >
                [[[ const w = states['weather.ims_weather'];
                    const t = states['sensor.ims_temperature'];
                    const temp = t && !['unknown','unavailable'].includes(t.state) ? `${t.state}°` : '—';
                    return `<ha-icon icon="mdi:weather-partly-cloudy"></ha-icon><span>${temp}</span>`; ]]]
            styles:
              card:
                - min-height: 320px
                - border-radius: 28px
                - border: 1px solid rgba(255,255,255,.20)
                - padding: 28px
                - overflow: hidden
                - background: linear-gradient(100deg, rgba(4,8,14,.75) 0%, rgba(7,12,20,.30) 58%, rgba(7,12,20,.10) 100%)
                - backdrop-filter: blur(4px)
                - box-shadow: 0 22px 70px rgba(0,0,0,.25)
              grid:
                - grid-template-areas: '"eyebrow clock" "title clock" "date weather"'
                - grid-template-columns: 1fr auto
                - grid-template-rows: min-content 1fr min-content
              custom_fields:
                eyebrow:
                  - justify-self: start
                  - font-family: Heebo, Arial, sans-serif
                  - font-size: 15px
                  - font-weight: 500
                  - color: rgba(255,255,255,.68)
                title:
                  - justify-self: start
                  - align-self: start
                  - font-family: Heebo, Arial, sans-serif
                  - font-size: clamp(30px, 4vw, 52px)
                  - font-weight: 600
                  - letter-spacing: -1.4px
                  - color: white
                clock:
                  - align-self: start
                  - font-family: Heebo, Arial, sans-serif
                  - font-size: clamp(34px, 5vw, 64px)
                  - font-weight: 400
                  - letter-spacing: -2px
                  - color: rgba(255,255,255,.96)
                date:
                  - justify-self: start
                  - font-family: Heebo, Arial, sans-serif
                  - font-size: 14px
                  - color: rgba(255,255,255,.66)
                weather:
                  - display: flex
                  - align-items: center
                  - gap: 7px
                  - font-family: Heebo, Arial, sans-serif
                  - font-size: 16px
                  - color: rgba(255,255,255,.88)
            extra_styles: |
              @keyframes homeiios-breathe { 0%,100% { filter: saturate(100%); } 50% { filter: saturate(112%); } }
              #card { animation: homeiios-breathe 12s ease-in-out infinite; }
              @media (max-width: 600px) {
                #card { min-height: 242px !important; padding: 22px !important; }
              }
              @media (prefers-reduced-motion: reduce) { #card { animation: none !important; } }
            grid_options:
              columns: full
              rows: 5

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: פעולות מהירות
            heading_style: title
            icon: mdi:gesture-tap
          - type: custom:button-card
            template: homeiios_quick_action
            entity: input_boolean.night_mode
            name: מצב לילה
            icon: mdi:weather-night
            tap_action:
              action: toggle
            grid_options: {columns: 3, rows: 2}
          - type: custom:button-card
            template: homeiios_quick_action
            entity: group.all_lights
            name: כל התאורה
            icon: mdi:lightbulb-group
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            grid_options: {columns: 3, rows: 2}
          - type: custom:button-card
            template: homeiios_quick_action
            entity: scene.restor
            name: שחזור
            icon: mdi:restore
            tap_action:
              action: perform-action
              perform_action: scene.turn_on
              target:
                entity_id: scene.restor
            grid_options: {columns: 3, rows: 2}
          - type: custom:button-card
            template: homeiios_quick_action
            entity: input_boolean.kiosk_full
            name: מסך מלא
            icon: mdi:fullscreen
            tap_action:
              action: toggle
            grid_options: {columns: 3, rows: 2}

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: עכשיו בבית
            heading_style: title
            icon: mdi:home-heart
          - type: custom:button-card
            template: homeiios_metric
            entity: sensor.ims_temperature
            name: טמפרטורה בחוץ
            icon: mdi:thermometer
            tap_action:
              action: navigate
              navigation_path: /dashboard-clean/weather
            grid_options: {columns: 6, rows: 2}
          - type: custom:button-card
            template: homeiios_metric
            entity: sensor.shelly_power_1
            name: צריכה נוכחית
            icon: mdi:flash
            tap_action:
              action: navigate
              navigation_path: /dashboard-clean/power
            grid_options: {columns: 6, rows: 2}
          - type: custom:button-card
            template: homeiios_metric
            entity: sensor.intercom_person_count
            name: זוהו בכניסה
            icon: mdi:doorbell-video
            tap_action:
              action: navigate
              navigation_path: cctv
            grid_options: {columns: 6, rows: 2}
          - type: custom:button-card
            template: homeiios_metric
            entity: binary_sensor.jewish_calendar_issur_melacha_in_effect
            name: מצב שבת
            icon: mdi:star-david
            grid_options: {columns: 6, rows: 2}

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: חללים
            heading_style: title
            icon: mdi:floor-plan
            tap_action:
              action: navigate
              navigation_path: rooms
          - type: custom:button-card
            template: homeiios_room
            name: סלון
            icon: mdi:sofa
            label: תאורה · מדיה · מיזוג
            show_label: true
            custom_fields: {status: מבט מהיר}
            tap_action: {action: navigate, navigation_path: livingroom}
            grid_options: {columns: 6, rows: 3}
          - type: custom:button-card
            template: homeiios_room
            name: מטבח וכניסה
            icon: mdi:silverware-fork-knife
            label: תאורה · כניסה · אינטרקום
            show_label: true
            custom_fields: {status: מבט מהיר}
            tap_action: {action: navigate, navigation_path: /dashboard-clean/entrance}
            grid_options: {columns: 6, rows: 3}
          - type: custom:button-card
            template: homeiios_room
            name: חדר שינה
            icon: mdi:bed-king
            label: תאורה · מיזוג · תריסים
            show_label: true
            custom_fields: {status: מבט מהיר}
            tap_action: {action: navigate, navigation_path: /dashboard-clean/bedroom}
            grid_options: {columns: 6, rows: 3}
          - type: custom:button-card
            template: homeiios_room
            name: חוץ וגג
            icon: mdi:palm-tree
            label: תאורת חוץ · השקיה · מזג אוויר
            show_label: true
            custom_fields: {status: מבט מהיר}
            tap_action: {action: navigate, navigation_path: /dashboard-clean/outside}
            grid_options: {columns: 6, rows: 3}
    footer:
      card:
        type: custom:button-card
        show_icon: false
        show_name: false
        styles:
          card:
            - max-width: 520px
            - margin: 8px auto 12px
            - padding: 5px
            - border-radius: 23px
            - border: 1px solid rgba(255,255,255,.18)
            - background: rgba(8,13,22,.72)
            - backdrop-filter: blur(24px) saturate(150%)
            - box-shadow: 0 16px 50px rgba(0,0,0,.34)
          grid:
            - grid-template-areas: '"home rooms media security more"'
            - grid-template-columns: repeat(5, 1fr)
        custom_fields:
          home:
            card:
              type: custom:button-card
              template: homeiios_nav_item
              name: בית
              icon: mdi:home-rounded
              tap_action: {action: navigate, navigation_path: home}
              styles:
                card: [{background: 'rgba(126,180,255,.16)'}]
                icon: [{color: '#A9D0FF'}]
                name: [{color: '#D6E9FF'}]
          rooms:
            card:
              type: custom:button-card
              template: homeiios_nav_item
              name: חדרים
              icon: mdi:floor-plan
              tap_action: {action: navigate, navigation_path: rooms}
          media:
            card:
              type: custom:button-card
              template: homeiios_nav_item
              name: מדיה
              icon: mdi:play-circle-outline
              tap_action: {action: navigate, navigation_path: media}
          security:
            card:
              type: custom:button-card
              template: homeiios_nav_item
              name: אבטחה
              icon: mdi:shield-home-outline
              tap_action: {action: navigate, navigation_path: cctv}
          more:
            card:
              type: custom:button-card
              template: homeiios_nav_item
              name: עוד
              icon: mdi:dots-horizontal-circle-outline
              tap_action: {action: navigate, navigation_path: more}

  - title: חדרים
    path: rooms
    icon: mdi:floor-plan
    type: sections
    theme: HOMEiiOS Glass
    max_columns: 3
    subview: true
    back_path: home
    sections:
      - type: grid
        cards:
          - type: heading
            heading: כל החללים
            heading_style: title
            icon: mdi:home-map-marker
          - type: custom:button-card
            template: homeiios_room
            name: סלון
            icon: mdi:sofa
            label: תאורה · מדיה · מיזוג
            show_label: true
            tap_action: {action: navigate, navigation_path: livingroom}
            grid_options: {columns: 6, rows: 3}
          - type: custom:button-card
            template: homeiios_room
            name: מטבח וכניסה
            icon: mdi:silverware-fork-knife
            label: תאורה · כניסה · אינטרקום
            show_label: true
            tap_action: {action: navigate, navigation_path: /dashboard-clean/entrance}
            grid_options: {columns: 6, rows: 3}
          - type: custom:button-card
            template: homeiios_room
            name: חדר שינה
            icon: mdi:bed-king
            label: תאורה · מיזוג · תריסים
            show_label: true
            tap_action: {action: navigate, navigation_path: /dashboard-clean/bedroom}
            grid_options: {columns: 6, rows: 3}
          - type: custom:button-card
            template: homeiios_room
            name: חדרי אגם וליעד
            icon: mdi:chair-rolling
            label: תאורה · מיזוג · מחשבים
            show_label: true
            tap_action: {action: navigate, navigation_path: /dashboard-clean/study}
            grid_options: {columns: 6, rows: 3}
          - type: custom:button-card
            template: homeiios_room
            name: מקלחת וגג
            icon: mdi:bathtub
            label: דוד · תאורה · גג
            show_label: true
            tap_action: {action: navigate, navigation_path: /dashboard-clean/bathroom}
            grid_options: {columns: 6, rows: 3}
          - type: custom:button-card
            template: homeiios_room
            name: חיצוני
            icon: mdi:palm-tree
            label: תאורה · השקיה · שערים
            show_label: true
            tap_action: {action: navigate, navigation_path: /dashboard-clean/outside}
            grid_options: {columns: 6, rows: 3}

  # מסכי מעבר זמניים. בגרסאות הבאות יוחלפו בכרטיסים הנבחרים מהדשבורד הקיים.
  - title: סלון
    path: livingroom
    type: sections
    subview: true
    back_path: rooms
    theme: HOMEiiOS Glass
    sections:
      - type: grid
        cards:
          - type: heading
            heading: סלון
            heading_style: title
            icon: mdi:sofa
          - type: markdown
            content: >
              מסך הסלון יועבר לכאן בשלב הבא. בינתיים ניתן לפתוח את המסך הקיים.
          - type: button
            name: פתיחת מסך הסלון הקיים
            icon: mdi:open-in-new
            tap_action: {action: navigate, navigation_path: /dashboard-clean/livingroom}

  - title: מדיה
    path: media
    type: sections
    subview: true
    back_path: home
    theme: HOMEiiOS Glass
    sections:
      - type: grid
        cards:
          - type: heading
            heading: מדיה ומוזיקה
            heading_style: title
            icon: mdi:play-circle-outline
          - type: button
            name: פתיחת Music Assistant הקיים
            icon: mdi:music
            tap_action: {action: navigate, navigation_path: /dashboard-clean/ma}

  - title: אבטחה
    path: cctv
    type: sections
    subview: true
    back_path: home
    theme: HOMEiiOS Glass
    sections:
      - type: grid
        cards:
          - type: heading
            heading: אבטחה ומצלמות
            heading_style: title
            icon: mdi:cctv
          - type: button
            name: פתיחת מסך המצלמות הקיים
            icon: mdi:cctv
            tap_action: {action: navigate, navigation_path: /dashboard-clean/cctv}

  - title: עוד
    path: more
    type: sections
    subview: true
    back_path: home
    theme: HOMEiiOS Glass
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: כל השירותים
            heading_style: title
            icon: mdi:dots-horizontal-circle-outline
          - type: tile
            name: מזג אוויר
            icon: mdi:weather-partly-cloudy
            entity: weather.ims_weather
            tap_action: {action: navigate, navigation_path: /dashboard-clean/weather}
            grid_options: {columns: 6, rows: 2}
          - type: tile
            name: צריכת חשמל
            icon: mdi:transmission-tower
            entity: sensor.shelly_power_1
            tap_action: {action: navigate, navigation_path: /dashboard-clean/power}
            grid_options: {columns: 6, rows: 2}
          - type: button
            name: שואב רובוט
            icon: mdi:robot-vacuum
            tap_action: {action: navigate, navigation_path: /dashboard-clean/roborock}
            grid_options: {columns: 6, rows: 2}
          - type: button
            name: תוכנית הבית
            icon: mdi:floor-plan
            tap_action: {action: navigate, navigation_path: /dashboard-clean/plan}
            grid_options: {columns: 6, rows: 2}
          - type: button
            name: משאבי מערכת
            icon: mdi:cpu-64-bit
            tap_action: {action: navigate, navigation_path: /dashboard-clean/resources}
            grid_options: {columns: 6, rows: 2}
          - type: button
            name: אינטרקום
            icon: mdi:doorbell-video
            tap_action: {action: navigate, navigation_path: /dashboard-clean/intercom}
            grid_options: {columns: 6, rows: 2}

